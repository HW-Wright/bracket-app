name: Supabase keep-alive

# Free projects pause after ~7 days idle; a real DB call every 3 days prevents it.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping() RPC
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling via the API resets that timer.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
